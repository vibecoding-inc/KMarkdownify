name: Markdown Lint

on:
  push:
    branches: [main, master]
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
          config: '.markdownlint.json'

      - name: Check for broken links (informational)
        continue-on-error: true
        run: |
          npm install -g markdown-link-check

          echo "Checking for broken links in markdown files..."
          for file in $(find . -name "*.md" ! -path "./node_modules/*"); do
            echo "Checking $file..."
            markdown-link-check "$file" --quiet || echo "Some links in $file may be broken (non-fatal)"
          done
