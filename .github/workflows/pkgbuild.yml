name: PKGBUILD Validation

on:
  push:
    branches: [main, master]
    paths:
      - 'PKGBUILD'
      - '.github/workflows/pkgbuild.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'PKGBUILD'
      - '.github/workflows/pkgbuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pkgbuild:
    name: Validate PKGBUILD
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update system and install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel namcap sudo git

      - name: Fix ownership and verify files
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing files:"
          ls -la
          if [ ! -f "PKGBUILD" ]; then
            echo "ERROR: PKGBUILD not found!"
            exit 1
          fi
          echo "✓ PKGBUILD found"

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "${GITHUB_WORKSPACE:-.}"

      - name: Validate PKGBUILD syntax
        run: |
          cd "${GITHUB_WORKSPACE:-.}"
          sudo -u builder bash -c "cd '$GITHUB_WORKSPACE' && source PKGBUILD && echo 'PKGBUILD syntax is valid'"

      - name: Run namcap on PKGBUILD
        run: |
          cd "${GITHUB_WORKSPACE:-.}"
          sudo -u builder bash -c "cd '$GITHUB_WORKSPACE' && namcap PKGBUILD"

      - name: Check PKGBUILD required fields
        run: |
          echo "Checking required PKGBUILD fields..."
          source PKGBUILD

          # Check required variables
          [ -n "$pkgname" ] && echo "✓ pkgname is set: $pkgname" || {
            echo "✗ pkgname is missing"; exit 1;
          }
          [ -n "$pkgver" ] && echo "✓ pkgver is set: $pkgver" || {
            echo "✗ pkgver is missing"; exit 1;
          }
          [ -n "$pkgrel" ] && echo "✓ pkgrel is set: $pkgrel" || {
            echo "✗ pkgrel is missing"; exit 1;
          }
          [ -n "$pkgdesc" ] && echo "✓ pkgdesc is set" || {
            echo "✗ pkgdesc is missing"; exit 1;
          }
          [ -n "$arch" ] && echo "✓ arch is set: ${arch[*]}" || {
            echo "✗ arch is missing"; exit 1;
          }
          [ -n "$url" ] && echo "✓ url is set: $url" || {
            echo "✗ url is missing"; exit 1;
          }
          [ -n "$license" ] && echo "✓ license is set: ${license[*]}" || {
            echo "✗ license is missing"; exit 1;
          }

          echo "✓ All required PKGBUILD fields are present"

      - name: Test package build (dry-run)
        run: |
          cd "${GITHUB_WORKSPACE:-.}"
          sudo -u builder bash -c "cd '$GITHUB_WORKSPACE' && makepkg --nobuild --nodeps"
          echo "✓ Package preparation succeeded"

      - name: Verify package files are present
        run: |
          echo "Checking if all source files exist..."
          [ -f "kmarkdownify.sh" ] && echo "✓ kmarkdownify.sh exists" || {
            echo "✗ kmarkdownify.sh missing"; exit 1;
          }
          [ -f "kmarkdownify.desktop" ] && echo "✓ kmarkdownify.desktop exists" || {
            echo "✗ kmarkdownify.desktop missing"; exit 1;
          }
          echo "✓ All package source files are present"
