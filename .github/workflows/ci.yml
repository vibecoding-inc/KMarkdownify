name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Project Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate service menu file syntax
        run: |
          echo "Checking kmarkdownify.desktop syntax..."
          # Basic syntax validation for KDE Service Menu file
          if [ ! -f "kmarkdownify.desktop" ]; then
            echo "✗ Service menu file not found"
            exit 1
          fi

          # Check for required sections
          if ! grep -q "^\[Desktop Entry\]" kmarkdownify.desktop; then
            echo "✗ Missing [Desktop Entry] section"
            exit 1
          fi

          if ! grep -q "^\[Desktop Action" kmarkdownify.desktop; then
            echo "✗ Missing [Desktop Action] section"
            exit 1
          fi

          # Check for required KDE Service Menu fields
          if ! grep -q "^Type=Service" kmarkdownify.desktop; then
            echo "✗ Missing Type=Service field"
            exit 1
          fi

          if ! grep -q "^ServiceTypes=" kmarkdownify.desktop; then
            echo "✗ Missing ServiceTypes field"
            exit 1
          fi

          echo "✓ Service menu file syntax is valid"

      - name: Check required dependencies in PKGBUILD
        run: |
          echo "Checking PKGBUILD dependencies..."
          required_deps=("bash" "curl" "jq" "coreutils" "file")

          for dep in "${required_deps[@]}"; do
            if grep -q "'$dep'" PKGBUILD; then
              echo "✓ $dep is listed in PKGBUILD"
            else
              echo "✗ $dep is missing from PKGBUILD"
              exit 1
            fi
          done

      - name: Verify script syntax
        run: |
          echo "Checking shell script syntax..."
          bash -n kmarkdownify.sh
          echo "✓ Shell script syntax is valid"

      - name: Check for common issues
        run: |
          echo "Checking for common issues..."

          # Check for hardcoded paths that might need to be configurable
          if grep -n "/usr/local/bin" kmarkdownify.sh > /dev/null; then
            echo "Note: Script references /usr/local/bin path (this is expected)"
          fi

          # Check that API key path uses HOME variable
          if ! grep -q "\${HOME}/.config/kmarkdownify/api_key" kmarkdownify.sh; then
            echo "Warning: API key path should use \${HOME} variable"
          else
            echo "✓ API key path uses HOME variable"
          fi

          # Verify set -euo pipefail is present (best practice)
          if ! grep -q "set -euo pipefail" kmarkdownify.sh; then
            echo "Warning: Script should use 'set -euo pipefail' for better error handling"
          else
            echo "✓ Script uses proper error handling with 'set -euo pipefail'"
          fi

          echo "✓ Common issues check complete"

  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
