[package]
name = "kmarkdownify"
version = "3.0.0"
edition = "2021"
authors = ["KMarkdownify Contributors"]
description = "Plasma Dolphin service menu for converting PDF files to Markdown using OpenRouter API"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
anyhow = "1.0"
notify-rust = "4.11"
dirs = "5.0"
eventsource-stream = "0.2"
futures-util = "0.3"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
